name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Resolve package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="$RELEASE_TAG"
          else
            version='0.0.0-ci'
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Restore and audit all dependencies
        run: dotnet restore src/GranSteL.Helpers.slnx --configfile nuget.config -p:NuGetAuditMode=all -warnaserror
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dotnet build src/GranSteL.Helpers.slnx -c Release --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -warnaserror
      - name: Test
        env:
          HELPERS_REDIS_TEST_PORT: ${{ job.services.redis.ports['6379'] }}
        run: dotnet test src/GranSteL.Helpers.slnx -c Release --no-build --no-restore -warnaserror
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet pack src/GranSteL.Helpers.Redis/GranSteL.Helpers.Redis.csproj
          -c Release --no-build -o package -p:Version="$VERSION"
          -p:ContinuousIntegrationBuild=true -p:RepositoryCommit="$GITHUB_SHA" -warnaserror
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-package
          path: package/GranSteL.Helpers.Redis.${{ steps.version.outputs.value }}.nupkg
          if-no-files-found: error
          overwrite: true
          retention-days: 30
