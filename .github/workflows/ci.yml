name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8.10.3-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        env:
          HELPERS_REDIS_TEST_PORT: ${{ job.services.redis.ports[6379] }}
        run: dotnet test src/GranSteL.Helpers.sln --configuration Release -warnaserror
