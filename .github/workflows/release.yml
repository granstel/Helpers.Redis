name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.id }}

defaults:
  run:
    shell: bash

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}

  attach:
    name: Attach package to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          files=(package/*.nupkg)
          package="${files[0]}"
          digest="sha256:$(sha256sum "$package" | cut -d ' ' -f1)"
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" |
            jq -r --arg name "${package##*/}" '.[] | select(.name == $name) | (.digest // "missing")')
          if [[ -z "$existing" ]]; then
            gh release upload "$TAG" "$package" --repo "$GITHUB_REPOSITORY"
          elif [[ "$existing" != "$digest" ]]; then
            echo "::error::The release already contains an asset with the same name and different content."
            exit 1
          fi

  nuget:
    name: Publish to NuGet.org
    needs: attach
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push package/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  github-packages:
    name: Publish to GitHub Packages
    needs: attach
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: package
      - name: Push package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/github-nuget.config"
          cat > "$config" <<EOF
          <configuration>
            <packageSources>
              <add key="github" value="https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" />
            </packageSources>
          </configuration>
          EOF
          export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$GH_TOKEN;ValidAuthenticationTypes=Basic"
          dotnet nuget push package/*.nupkg --configfile "$config" --source github --api-key "$GH_TOKEN" --skip-duplicate
